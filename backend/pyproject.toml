[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline-backend"
version = "0.2.0"
description = "Verified conversational data pipeline designer"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2", "google-genai>=2.34,<3", "tenacity>=9,<10",
  "pyyaml>=6,<7", "networkx>=3,<4", "jinja2>=3,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
spark = ["pyspark==3.5.8"]
team = []

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/compiler", "src/pipeline_generator", "src/pipeline_spec", "src/validator", "src/db", "src/api"]


[tool.hatch.build.targets.wheel.force-include]
"alembic" = "db/alembic"
"alembic.ini" = "db/alembic.ini"
