[project]
name = "data-pipeline-analyst"
version = "0.1.0"
description = "AI Analyst and Pipeline Specification Contract for verifiable data pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "pydantic>=2.14.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["analyst/tests", "pipeline_spec/tests", "formal_check/tests"]
addopts = "-q"
