[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline-analyst"
version = "0.2.0"
description = "Verified conversational data pipeline designer"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2", "google-genai>=2.34,<3", "tenacity>=9,<10",
  "pyyaml>=6,<7", "networkx>=3,<4", "jinja2>=3,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
spark = ["pyspark==3.5.8"]
team = []

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_generator", "analyst", "pipeline_spec", "formal_check"]

[tool.pytest.ini_options]
testpaths = ["tests", "analyst/tests", "pipeline_spec/tests", "formal_check/tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["postgres: requires TEST_DATABASE_URL", "spark: explicit local synthetic-data demonstration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
