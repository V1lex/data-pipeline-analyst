[project]
name = "data-pipeline-analyst"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["data-pipeline-backend"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
data-pipeline-backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "backend/src/agent/analyst/tests", "backend/src/pipeline_spec/tests", "backend/src/compiler/formal_check/tests"]
pythonpath = ["backend/src", "."]
addopts = "-ra"
markers = ["postgres: requires TEST_DATABASE_URL", "spark: explicit local synthetic-data demonstration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
