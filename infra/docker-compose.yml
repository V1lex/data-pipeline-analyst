services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pipeline}
      DATABASE_SCHEMA: public
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_MODEL: ${POLZA_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      POLZA_TIMEOUT: ${POLZA_TIMEOUT:-60}
      SOURCE_MAX_BYTES: ${SOURCE_MAX_BYTES:-10485760}
      SOURCE_MAX_FILES: ${SOURCE_MAX_FILES:-20}
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "python -m db.migrations && uvicorn api.app:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-pipeline}
      DATABASE_SCHEMA: public
      TLC_JAR_PATH: /app/worker/tla2tools.jar
      TLC_TIMEOUT: ${TLC_TIMEOUT_SECONDS:-30}
      TLC_WORKERS: ${TLC_WORKERS:-4}
      TLC_HEAP_SIZE: ${TLC_HEAP_SIZE:-512m}
      TLC_MAX_STATES: ${TLC_MAX_STATES:-1000000}
    mem_limit: 3g
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
