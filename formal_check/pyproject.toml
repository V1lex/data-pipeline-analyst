[project]
name = "formal-check"
version = "0.1.0"
description = "Provides validation for json from agent and TLC model check"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "coverage==7.17.0",
    "ruff==0.17.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["src"]

#[tool.coverage.run]
#source = ["src"]
#branch = true
#parallel = true
#omit = ["*/__init__.py", "*/main.py"]

#[tool.coverage.report]
#show_missing = true
#fail_under = 80

[tool.ruff.lint]
extend-select = ["I", "UP", "F", "B"]
ignore = ["PIE790"]
fixable = ["I", "UP", "F401"]

[tool.mypy]
plugins = [
    "pydantic.mypy"
]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
